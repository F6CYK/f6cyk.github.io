{% for noeud in include.noeuds %}

<li{% if noeud.enfants %} class="menu-deroulant"{% endif %}>

<a href="{{ item.url | relative_url }}">{{ item.title }}</a>

{% if item.children %}
<button class="mobile-submenu-toggle"
        type="button"
        aria-label="Développer le sous-menu">
    ▶
</button>
{% endif %}

    {% else %}

        <a href="#" tabindex="0">
            {{ noeud.titre }}
        </a>

    {% endif %}

    {% if noeud.enfants %}
        <ul class="sous-menu">
            {% include recursive-menu.html noeuds=noeud.enfants %}
        </ul>
    {% endif %}

</li>

{% endfor %}
